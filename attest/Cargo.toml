[package]
name = "hus-attest"
version = "0.1.0"
edition = "2021"
description = "Hardware attestation checks for HUS submissions (Android Key Attestation)"
license = "MIT"

[dependencies]
x509-parser = { version = "0.16", features = ["verify"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rcgen = "0.13"

[features]
# Lets callers trust roots other than Google's. Only for tests of code that
# uses this crate; never enable it in a verifier that accepts registrations.
test-roots = []
