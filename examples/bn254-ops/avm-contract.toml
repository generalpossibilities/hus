[descriptor]
execution_mode = "message_isolated"
state_schema_id = "424e323534000000000000000000000000000000000000000000000000000001"

[abi]
state_root_type_id = 1

# Last result: G1 point (64 B) for add/mul, or 1 byte (1 / 0) for the pairing check.
[[abi.types]]
id = 1
kind = "bytes"
name = "bn254_last_result"

# op (1 B: 0 add, 1 mul, 2 pairing) then the operation's input, big-endian EIP-196/197:
# add: P | Q (128 B); mul: P | s (96 B); pairing: k x (G1 | G2) (192 B each).
[[abi.types]]
id = 2
kind = "bytes"
name = "bn254_input"

[[abi.methods]]
name = "bn254.call"
input_type_id = 2

[[abi.errors]]
status_code = 4000
name = "invalid_input"
message = "input has the wrong length or a point is not valid"
