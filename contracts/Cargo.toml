[package]
name = "hus-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
libm = "0.2"

[dev-dependencies]
hus-sdk = { path = "../sdk" }

[features]
default = ["std"]
std = ["serde/std"]
