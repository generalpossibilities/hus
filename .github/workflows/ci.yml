name: CI

on:
  push:
    branches: [main, test-prod]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude hus-onchain --all-targets -- -D warnings

      - name: Check SDK
        run: cargo check --lib -p hus-sdk

      - name: Check WASM SDK
        run: cargo check --target wasm32-unknown-unknown --no-default-features -p hus-sdk

      - name: Audit
        run: cargo audit

      - name: Test SDK (lib)
        run: cargo test --lib -p hus-sdk
