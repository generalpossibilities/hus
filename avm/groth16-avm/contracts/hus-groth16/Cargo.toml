[workspace]

[package]
name = "hus-groth16-avm"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
avm-contract-sdk = { path = "../../crates/avm-contract-sdk" }
ark-groth16 = { version = "0.4", default-features = false }
ark-bn254 = { version = "0.4", default-features = false, features = ["curve"] }
ark-ff = { version = "0.4", default-features = false }
ark-serialize = { version = "0.4", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
