[package]
name = "hus-onchain"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tvm_client = { git = "https://github.com/tvmlabs/tvm-sdk.git", rev = "3b6a038067fa162c5ab11ef28851d2cc9655a705" }
base64 = "0.22"
ureq = { version = "2.9", default-features = false, features = ["json"] }
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
hus-sdk = { path = "../sdk" }
getrandom = "0.2"
pasta_curves = "0.5"
hex = "0.4"
blake3 = "1"
